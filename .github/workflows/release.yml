name: Release Extension

# Tag `ext-v1.2.0` to release the browser extension. The terminal app has its
# own workflow on `sh-v*` tags (release-shellapp.yml).
on:
  push:
    tags:
      - "ext-v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip extension
        # We target the subdirectory from the root
        run: |
          zip -r hittable-extension.zip browserExtension/ \
            -x "browserExtension/.git/*" \
            -x "browserExtension/.github/*" \
            -x "*.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Browser extension ${{ github.ref_name }}
          files: hittable-extension.zip
          generate_release_notes: true
          # The website downloads releases/latest/download/hittable-extension.zip,
          # so every extension release must be the repo's latest.
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}