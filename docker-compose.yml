services:
  frontend:
    container_name: frontend
    # Dev server with live reload; the Dockerfile builds the production image.
    image: node:24-bookworm
    working_dir: /frontend
    command: sh -c "corepack enable && sh dockerEntryPoint.sh"
    volumes:
      - source: .
        target: /frontend
        type: bind

      - source: frontend
        target: /frontend/node_modules
        type: volume
    ports:
      - target: 3000
        published: 3000
        protocol: tcp

      - target: 9229
        published: 9229
        protocol: tcp

volumes:
  frontend: